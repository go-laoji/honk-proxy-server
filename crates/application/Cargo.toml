[package]
name = "hps-application"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
hps-dns.workspace = true
hps-net.workspace = true
hps-platform.workspace = true
if-addrs = "0.15"
sha2 = "0.10"
serde.workspace = true
hps-config.workspace = true
hps-domain.workspace = true
hps-engine.workspace = true
hps-storage.workspace = true
hps-provider.workspace = true
hps-health.workspace = true
ip2region = { git = "https://github.com/lionsoul2014/ip2region.git", rev = "92e6a788d17c3185c852ca983124c3fca280f992" }
reqwest.workspace = true
sha1 = "0.10"
tempfile = "3"
tracing.workspace = true
tokio-util = { version = "0.7", features = ["rt"] }
tokio.workspace = true
uuid.workspace = true
serde_json.workspace = true
toml.workspace = true
thiserror.workspace = true
tracing-subscriber.workspace = true
arc-swap = "1.9"
ipnet = "2.12.2"

[dev-dependencies]
hickory-proto = "0.26.3"
axum.workspace = true
rusqlite = "0.41"
rcgen = "0.14"
reqwest = { workspace = true, features = ["socks"] }
bytes = "1"
http = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }

[target.'cfg(target_os = "linux")'.dev-dependencies]
aya = "0.14"

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"
hps-ebpf-abi = {workspace = true,features=["userspace"]}
