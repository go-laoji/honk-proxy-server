[package]
name = "hps-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

# Run once for the whole product, rather than once for each workspace crate.
[package.metadata.release]
pre-release-hook = ["python", "../../scripts/versioning.py", "--hook"]

[[bin]]
name = "hps"
path = "src/main.rs"

[dependencies]
hps-storage.workspace = true
hps-system.workspace = true
hps-dns.workspace = true
hps-net.workspace = true
hps-client.workspace = true
hps-platform.workspace = true
hps-config.workspace = true
hps-domain.workspace = true
clap.workspace = true
serde_json.workspace = true
serde.workspace = true
tokio.workspace = true
uuid.workspace = true
toml.workspace = true
