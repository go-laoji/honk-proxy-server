[package]
name = "hps-daemon"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[[bin]]
name = "hpsd"
path = "src/main.rs"

[dependencies]
hps-api.workspace = true
hps-config.workspace = true
hps-engine.workspace = true
hps-application.workspace = true
hps-storage.workspace = true
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
axum.workspace = true
clap.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[features]
default = ["web-ui"]
web-ui = ["hps-api/web-ui"]

[dev-dependencies]
rcgen = "0.14"
tempfile = "3"
reqwest.workspace = true
