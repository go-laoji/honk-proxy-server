[package]
name = "hps-daemon"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[[bin]]
name = "hpsd"
path = "src/main.rs"

[dependencies]
serde_json.workspace = true
hps-api.workspace = true
hps-config.workspace = true
hps-engine.workspace = true
hps-application.workspace = true
hps-storage.workspace = true
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
axum.workspace = true
clap.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[features]
default = ["web-ui"]
web-ui = ["hps-api/web-ui"]

[dev-dependencies]
hps-domain.workspace = true
hps-net.workspace = true
toml.workspace = true
hps-client.workspace = true
rcgen = "0.14"
tempfile = "3"
reqwest.workspace = true

[target.'cfg(target_os = "linux")'.dev-dependencies]
aya = "0.14"
libc = "0.2"
