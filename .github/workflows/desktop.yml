name: Independent Desktop packages
on:
  workflow_call:
permissions:
  contents: read
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm, macos-15]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    env:
      HPS_FORBID_HOST_NETWORK_CHANGES: '1'
      CARGO_BUILD_JOBS: '2'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: pnpm/action-setup@a8198c4bff370c8506180b035930dea56dbd5288
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24.15.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: shared-web
          path: dist
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: verified-kernel
          path: target/verified-kernel
      - name: Install Linux WebView build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev librsvg2-dev libayatana-appindicator3-dev patchelf
      - run: scripts/build-headless.sh
      - name: Package Desktop
        shell: bash
        run: |
          args=()
          if [[ "$RUNNER_OS" == Linux ]]; then
            args+=(--ebpf target/verified-kernel/hps-ebpf.elf --kernel-report target/verified-kernel/acceptance.json)
          fi
          python3 scripts/package-desktop.py --daemon target/release/hpsd "${args[@]}"
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: desktop-${{ matrix.runner }}
          path: |
            target/packages-desktop/desktop-manifest.json
            target/desktop-release/release/bundle/
          if-no-files-found: error
