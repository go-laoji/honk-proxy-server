[workspace]
resolver = "2"
members = ["apps/cli", "apps/daemon", "crates/domain", "crates/config", "crates/client", "crates/api", "crates/web-assets", "crates/platform", "crates/engine"]
default-members = ["apps/cli", "apps/daemon"]
exclude = ["src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"

[workspace.dependencies]
hps-domain = { path = "crates/domain" }
hps-config = { path = "crates/config" }
hps-client = { path = "crates/client" }
hps-api = { path = "crates/api" }
hps-platform = { path = "crates/platform" }
hps-engine = { path = "crates/engine" }
axum = "0.8"
clap = { version = "4.6", features = ["derive", "env"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "time", "io-util", "sync"] }
toml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid = { version = "1", features = ["v4"] }

[profile.release]
lto = "thin"
strip = true
